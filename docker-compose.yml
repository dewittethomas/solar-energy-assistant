services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      SQLITE_DB_PATH: ${SQLITE_DB_PATH:-storage/app.db}
      MODEL_STORAGE_DIR: ${MODEL_STORAGE_DIR:-model_artifacts}
      UPLOAD_STORAGE_DIR: ${UPLOAD_STORAGE_DIR:-storage/uploads}
    volumes:
      - ./api/${MODEL_STORAGE_DIR:-model_artifacts}:/app/${MODEL_STORAGE_DIR:-model_artifacts}
      - ./api/storage:/app/storage
      - ./api/${UPLOAD_STORAGE_DIR:-storage/uploads}:/app/${UPLOAD_STORAGE_DIR:-storage/uploads}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
